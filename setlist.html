<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scaletta Canzoni - VoiceLive 2</title>
  <style>
    :root { --bg:#101216; --card:#191c22; --card2:#20242c; --text:#ffffff; --dim:#9da3ad; --green:#25d366; --red:#ff4d4d; --border:#30353f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; padding:18px; }
    .container { max-width:650px; margin:auto; }
    a.back { color:#3d8bfd; text-decoration:none; display:inline-block; margin-bottom:15px; font-size:14px; }
    h1 { font-size:22px; margin:0 0 15px; }
    .section { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:15px; }
    label { display:block; margin-bottom:6px; color:var(--dim); font-size:13px; }
    select, button { width:100%; min-height:48px; border-radius:10px; border:1px solid var(--border); background:var(--card2); color:white; font-size:16px; padding:0 10px; }
    button { cursor:pointer; font-weight:bold; margin-top:8px; }
    .connect { background:#26364f; }
    .log { height:120px; overflow:auto; background:#090b0e; border-radius:10px; padding:10px; font-family:monospace; font-size:12px; color:#bfc5cf; white-space:pre-wrap; }
    .song-btn { background:#28452f; margin-bottom:8px; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back">← Menu Principale</a>
  <h1>Scaletta Canzoni & Preset</h1>

  <!-- CONNESSIONE BLE SK-7 -->
  <div class="section">
    <label>Connessione BLE SK-7 OUT</label>
    <button id="btnOut" class="connect" onclick="connectOut()">CONNETTI SK-7 OUT</button>
  </div>

  <!-- SELEZIONE CANALE MIDI -->
  <div class="section">
    <label>Canale MIDI</label>
    <select id="midiChannel">
      <option value="0">Canale 1</option>
      <option value="1">Canale 2</option>
    </select>
  </div>

  <!-- BRANO A CASO / PROVA -->
  <div class="section">
    <label>Test Rapido</label>
    <button style="background:#3d8bfd;" onclick="playRandomSong()">🎲 Invia Brano Casuale</button>
  </div>

  <!-- SCALETTA BRANI -->
  <div class="section">
    <label>Lista Canzoni</label>
    <select id="songSelect" onchange="onSongChange(this.value)">
      <option value="">-- Seleziona Brano --</option>
      <option value="1">1. Acoustic Intro (Preset 1)</option>
      <option value="15">2. Bohemian Rhapsody (Preset 15)</option>
      <option value="42">3. Hotel California (Preset 42)</option>
      <option value="135">4. Rock Solo (Preset 135 - Banco 2)</option>
    </select>
  </div>

  <!-- LOG MIDI -->
  <div class="section">
    <label>LOG MIDI</label>
    <div id="log" class="log"></div>
  </div>
</div>

<script src="midi-core.js"></script>
<script>
  function connectOut() {
    connectOutputSK7((name) => {
      const btn = document.getElementById("btnOut");
      if (name) {
        btn.textContent = "CONNESSO: " + name;
        btn.style.background = "#28452f";
      } else {
        btn.textContent = "CONNETTI SK-7 OUT";
        btn.style.background = "#26364f";
      }
    });
  }

  function onSongChange(preset) {
    if (preset) sendPresetChange(parseInt(preset, 10));
  }

  function playRandomSong() {
    const samplePresets = [1, 15, 42, 88, 135];
    const rand = samplePresets[Math.floor(Math.random() * samplePresets.length)];
    sendPresetChange(rand);
  }
</script>

</body>
</html>
