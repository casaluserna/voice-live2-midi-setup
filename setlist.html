<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scaletta & Testi - VoiceLive 2</title>
  <style>
    :root { 
      --bg:#101216; 
      --card:#191c22; 
      --card2:#20242c; 
      --text:#ffffff; 
      --dim:#9da3ad; 
      --green:#25d366; 
      --red:#ff4d4d; 
      --blue:#3d8bfd;
      --border:#30353f; 
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; padding:18px; }
    .container { max-width:650px; margin:auto; }
    a.back { color:var(--blue); text-decoration:none; display:inline-block; margin-bottom:15px; font-size:14px; }
    h1 { font-size:22px; margin:0 0 15px; }
    .section { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:15px; }
    label { display:block; margin-bottom:6px; color:var(--dim); font-size:13px; }
    select, input, textarea, button { width:100%; min-height:48px; border-radius:10px; border:1px solid var(--border); background:var(--card2); color:white; font-size:16px; padding:0 12px; }
    input, textarea { margin-bottom:10px; }
    textarea { font-family:inherit; padding:10px; resize:vertical; min-height:80px; }
    button { cursor:pointer; font-weight:bold; margin-top:8px; }
    button:active { transform:scale(0.98); }
    
    .connect { background:#26364f; }
    .btn-add { background:#214e30; color:#8cffae; border-color:#28452f; }
    .btn-cancel { background:#3a3f4d; color:#ffffff; border-color:var(--border); display:none; }
    .btn-lyrics { background:#3d2b56; color:#d8b4fe; border-color:#5b3e82; display:block; text-align:center; text-decoration:none; line-height:48px; }
    
    .backup-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:5px; }
    .btn-backup { background:#2a3342; border-color:#3b475a; color:#d1d5db; min-height:44px; font-size:14px; }

    .nav-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
    .btn-nav { min-height:55px; font-size:18px; background:#20242c; border-color:var(--blue); }

    .song-list-item { display:flex; justify-content:space-between; align-items:center; background:var(--card2); padding:10px 14px; border-radius:8px; margin-bottom:8px; border:1px solid var(--border); }
    .song-info { font-size:15px; flex-grow:1; margin-right:10px; }
    .song-preset-badge { color:var(--blue); font-weight:bold; font-size:13px; margin-left:8px; }
    
    .action-btns { display:flex; gap:6px; }
    .btn-edit { background:#284263; color:#7cb3ff; border:none; padding:6px 10px; border-radius:6px; width:auto; min-height:36px; font-size:13px; }
    .btn-del { background:#512222; color:#ff4d4d; border:none; padding:6px 10px; border-radius:6px; width:auto; min-height:36px; font-size:13px; }

    /* LAYOUT NOTE & PLAYER LRC */
    .notes-controls { display:flex; justify-content:space-between; align-items:center; margin-top:10px; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
    .font-select { width:auto; min-height:36px; height:36px; font-size:13px; padding:0 8px; }

    .player-bar { display:flex; gap:8px; margin-bottom:10px; }
    .btn-play { background:#214e30; color:#8cffae; border-color:#28452f; min-height:44px; flex:2; }
    .btn-stop { background:#512222; color:#ff4d4d; border-color:#632828; min-height:44px; flex:1; }

    .notes-wrapper { display:flex; gap:8px; align-items:stretch; flex-grow:1; }
    
    /* BOX VISUALIZZAZIONE TESTO LRC */
    .lrc-display { background:#090b0e; border:1px solid var(--border); border-radius:8px; padding:16px; font-size:18px; color:#e2e8f0; height:60vh; min-height:350px; overflow-y:auto; flex-grow:1; box-sizing:border-box; scroll-behavior:smooth; }
    .lrc-line { padding:6px 8px; border-radius:6px; transition:all 0.2s ease; margin-bottom:4px; opacity:0.6; }
    .lrc-line.active { background:#284263; color:#ffffff; font-weight:bold; opacity:1; transform:scale(1.01); }

    .notes-editor { background:#090b0e; border:1px solid var(--border); border-radius:8px; padding:12px; font-size:16px; color:#e2e8f0; height:60vh; min-height:350px; width:100%; box-sizing:border-box; display:none; }
    
    .scroll-btns { display:flex; flex-direction:column; gap:8px; width:55px; }
    .btn-scroll { flex:1; min-height:auto; font-size:22px; background:#252d3a; border-color:#3b475a; color:#7cb3ff; padding:0; display:flex; align-items:center; justify-content:center; }
    
    .btn-toggle-edit { background:#2a3342; border-color:#3b475a; color:#d1d5db; min-height:36px; font-size:13px; width:auto; margin-top:0; }
    .btn-fullscreen { background:#1f324d; border-color:#3d8bfd; color:#7cb3ff; min-height:36px; font-size:13px; width:auto; margin-top:0; }
    .btn-save-notes { background:#1e3a5f; color:#93c5fd; border-color:#2b4c7e; min-height:44px; font-size:14px; margin-top:8px; display:none; }

    /* STILI PER MODALITÀ SCHERMO INTERO */
    .fullscreen-mode {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      background: var(--bg) !important;
      padding: 15px !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      border-radius: 0 !important;
      border: none !important;
    }
    .fullscreen-mode .lrc-display, 
    .fullscreen-mode .notes-editor {
      height: 100% !important;
      min-height: unset !important;
    }

    .log { height:120px; overflow:auto; background:#090b0e; border-radius:10px; padding:10px; font-family:monospace; font-size:12px; color:#bfc5cf; white-space:pre-wrap; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back">← Menu Principale</a>
  <h1>Scaletta, Preset & Testi</h1>

  <!-- CONNESSIONE BLE -->
  <div class="section">
    <label>Connessione BLE SK-7 OUT</label>
    <button id="btnOut" class="connect" onclick="connectOut()">CONNETTI SK-7 OUT</button>
  </div>

  <!-- CANALE MIDI -->
  <div class="section">
    <label>Canale MIDI</label>
    <select id="midiChannel">
      <option value="0">Canale 1</option>
      <option value="1">Canale 2</option>
      <option value="2">Canale 3</option>
    </select>
  </div>

  <!-- ESECUZIONE LIVE & TESTO -->
  <div class="section">
    <label>Esecuzione Scaletta Live</label>
    <select id="songSelect" onchange="onSongChange(this.value)">
      <option value="">-- Seleziona Brano --</option>
    </select>

    <div class="nav-grid">
      <button class="btn-nav" onclick="prevSong()">◀ Precedente</button>
      <button class="btn-nav" onclick="nextSong()">Successiva ▶</button>
    </div>

    <div style="margin-top:15px;">
      <a id="lyricsLink" class="btn-lyrics" href="#" target="_blank" style="display:none;">🔍 Cerca testo su Google</a>
      
      <!-- CONTROLLI LRC E TELEPROMPTER -->
      <div id="notesContainer" style="display:none;">
        
        <div class="player-bar" id="playerBar" style="display:none;">
          <button id="btnPlay" class="btn-play" onclick="togglePlay()">▶ PLAY SCORRIMENTO</button>
          <button id="btnStop" class="btn-stop" onclick="stopPlay()">⏹ STOP</button>
        </div>

        <div class="notes-controls">
          <button class="btn-fullscreen" id="btnFullscreen" onclick="toggleFullscreen()">⛶ Schermo Intero</button>
          <button class="btn-toggle-edit" id="btnEditMode" onclick="toggleEditMode()">✏️ Modifica Codice LRC/Testo</button>
          <select id="fontSizeSelect" class="font-select" onchange="changeFontSize(this.value)">
            <option value="14px">Dimensione: Piccola</option>
            <option value="18px" selected>Dimensione: Normale</option>
            <option value="22px">Dimensione: Grande</option>
            <option value="28px">Dimensione: Molto Grande</option>
          </select>
        </div>

        <div class="notes-wrapper">
          <!-- DISPLAY PER TESTO SCORREVOLE (PULITO DAI TIMING) -->
          <div id="lrcDisplay" class="lrc-display"></div>
          
          <!-- EDITOR RAW PER TESTO CON TIMING .LRC -->
          <textarea id="songNotes" class="notes-editor" placeholder="Incolla qui il testo con timing in formato .lrc [00:12.50]..." oninput="onNotesInput()"></textarea>

          <div class="scroll-btns">
            <button class="btn-scroll" onclick="scrollNotes('up')">▲</button>
            <button class="btn-scroll" onclick="scrollNotes('down')">▼</button>
          </div>
        </div>

        <button id="btnSaveLiveNotes" class="btn-save-notes" onclick="saveLiveNotes()">💾 Salva Codice LRC / Note</button>
      </div>
    </div>
  </div>

  <!-- FORM AGGIUNGI / MODIFICA BRANO -->
  <div class="section">
    <label id="formLabel">Aggiungi Nuovo Brano</label>
    <input type="text" id="newTitle" placeholder="Titolo Canzone ed Artista (es. Hotel California - Eagles)">
    <input type="number" id="newPreset" placeholder="Numero Preset VoiceLive (es. 42)" min="1" max="384">
    <textarea id="newNotes" placeholder="Note o testo in formato .lrc [00:10.00] Inizio canto..."></textarea>
    
    <button id="btnSave" class="btn-add" onclick="saveSong()">+ Salva in Scaletta</button>
    <button id="btnCancelEdit" class="btn-cancel" onclick="cancelEdit()">Annulla Modifica</button>
  </div>

  <!-- GESTIONE BRANI & BACKUP -->
  <div class="section">
    <label>Brani Memorizzati</label>
    <div id="songsContainer"></div>

    <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">

    <label>Backup & Ripristino Scaletta</label>
    <div class="backup-grid">
      <button class="btn-backup" onclick="exportSetlist()">💾 Esporta (.JSON)</button>
      <button class="btn-backup" onclick="document.getElementById('importFile').click()">📂 Importa (.JSON)</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importSetlist(event)">
  </div>

  <!-- LOG -->
  <div class="section">
    <label>LOG MIDI</label>
    <div id="log" class="log"></div>
  </div>
</div>

<script src="midi-core.js"></script>
<script>
  let songs = [];
  let editingIndex = null;
  let activeSongIndex = null;

  // VARIABILI TELEPROMPTER LRC
  let parsedLrc = [];
  let isPlaying = false;
  let startTime = 0;
  let timerInterval = null;
  let isRawEditMode = false;
  let isFullscreen = false;

  window.addEventListener("load", () => {
    loadSongsFromStorage();
    renderSongsUI();
  });

  function connectOut() {
    connectOutputSK7((name) => {
      const btn = document.getElementById("btnOut");
      if (name) {
        btn.textContent = "CONNESSO: " + name;
        btn.style.background = "#28452f";
      } else {
        btn.textContent = "CONNETTI SK-7 OUT";
        btn.style.background = "#26364f";
      }
    });
  }

  function loadSongsFromStorage() {
    const saved = localStorage.getItem("voicelive_setlist");
    if (saved) {
      try { songs = JSON.parse(saved); } catch (e) { songs = []; }
    } else {
      songs = [
        { 
          title: "Hotel California - Eagles", 
          preset: 42, 
          notes: "[00:02.00]Intro chitarra...\n[00:08.50]On a dark desert highway\n[00:12.00]Cool wind in my hair\n[00:16.00]Warm smell of colitas\n[00:19.50]Rising up through the air" 
        }
      ];
      saveSongsToStorage();
    }
  }

  function saveSongsToStorage() {
    localStorage.setItem("voicelive_setlist", JSON.stringify(songs));
  }

  function renderSongsUI() {
    const select = document.getElementById("songSelect");
    const container = document.getElementById("songsContainer");

    select.innerHTML = '<option value="">-- Seleziona Brano --</option>';
    container.innerHTML = "";

    if (songs.length === 0) {
      container.innerHTML = '<div style="color:var(--dim); font-size:13px;">Nessun brano in scaletta.</div>';
      return;
    }

    songs.forEach((song, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.textContent = `${index + 1}. ${song.title} (Preset ${song.preset})`;
      select.appendChild(opt);

      const div = document.createElement("div");
      div.className = "song-list-item";
      div.innerHTML = `
        <div class="song-info">
          <b>${index + 1}. ${song.title}</b>
          <span class="song-preset-badge">Preset ${song.preset}</span>
        </div>
        <div class="action-btns">
          <button class="btn-edit" onclick="editSong(${index})">Modifica</button>
          <button class="btn-del" onclick="deleteSong(${index})">Elimina</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  /* =========================================================
     OPERAZIONI AGGIUNTA / MODIFICA / SALVATAGGIO
     ========================================================= */

  function saveSong() {
    const titleInput = document.getElementById("newTitle");
    const presetInput = document.getElementById("newPreset");
    const notesInput = document.getElementById("newNotes");

    const title = titleInput.value.trim();
    const preset = parseInt(presetInput.value, 10);
    const notes = notesInput.value.trim();

    if (!title || isNaN(preset) || preset < 1 || preset > 384) {
      alert("Inserisci un titolo ed un preset valido (1-384).");
      return;
    }

    if (editingIndex !== null) {
      songs[editingIndex] = { title: title, preset: preset, notes: notes };
      log(`Aggiornato: ${title} (Preset ${preset})`);
    } else {
      songs.push({ title: title, preset: preset, notes: notes });
      log(`Aggiunto: ${title} (Preset ${preset})`);
    }

    saveSongsToStorage();
    renderSongsUI();
    resetForm();
  }

  function editSong(index) {
    editingIndex = index;
    const song = songs[index];

    document.getElementById("newTitle").value = song.title;
    document.getElementById("newPreset").value = song.preset;
    document.getElementById("newNotes").value = song.notes || "";

    document.getElementById("formLabel").textContent = `Modifica Brano #${index + 1}`;
    document.getElementById("btnSave").textContent = "✓ Salva Modifiche";
    document.getElementById("btnCancelEdit").style.display = "block";

    document.getElementById("formLabel").scrollIntoView({ behavior: 'smooth' });
  }

  function cancelEdit() {
    resetForm();
  }

  function resetForm() {
    editingIndex = null;
    document.getElementById("newTitle").value = "";
    document.getElementById("newPreset").value = "";
    document.getElementById("newNotes").value = "";

    document.getElementById("formLabel").textContent = "Aggiungi Nuovo Brano";
    document.getElementById("btnSave").textContent = "+ Salva in Scaletta";
    document.getElementById("btnCancelEdit").style.display = "none";
  }

  function deleteSong(index) {
    if (confirm(`Rimuovere "${songs[index].title}"?`)) {
      songs.splice(index, 1);
      saveSongsToStorage();
      renderSongsUI();
      if (editingIndex === index) resetForm();
    }
  }

  /* =========================================================
     IMPORTA ED ESPORTA SCALETTA (BACKUP JSON)
     ========================================================= */

  function exportSetlist() {
    if (songs.length === 0) {
      alert("La scaletta è vuota, non c'è nulla da esportare.");
      return;
    }

    const jsonStr = JSON.stringify(songs, null, 2);
    const blob = new Blob([jsonStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    
    const date = new Date().toISOString().slice(0, 10);
    const a = document.createElement("a");
    a.href = url;
    a.download = `scaletta_voicelive_${date}.json`;
    a.click();
    
    URL.revokeObjectURL(url);
    log("Scaletta esportata con successo.");
  }

  function importSetlist(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);

        if (Array.isArray(importedData)) {
          if (confirm("L'importazione sostituirà la tua scaletta attuale. Vuoi continuare?")) {
            songs = importedData;
            saveSongsToStorage();
            renderSongsUI();
            resetForm();
            alert("Scaletta importata con successo!");
            log("Nuova scaletta caricata da file JSON.");
          }
        } else {
          alert("Il file non contiene una scaletta valida.");
        }
      } catch (err) {
        alert("Errore nella lettura del file JSON: " + err.message);
      }
      event.target.value = "";
    };

    reader.readAsText(file);
  }

  /* =========================================================
     GESTIONE SCHERMO INTERO (FULLSCREEN)
     ========================================================= */

  function toggleFullscreen() {
    const container = document.getElementById("notesContainer");
    const btn = document.getElementById("btnFullscreen");

    isFullscreen = !isFullscreen;

    if (isFullscreen) {
      container.classList.add("fullscreen-mode");
      btn.textContent = "✕ Chiudi Fullscreen";
      btn.style.background = "#512222";
      btn.style.borderColor = "#632828";
      btn.style.color = "#ff4d4d";
    } else {
      container.classList.remove("fullscreen-mode");
      btn.textContent = "⛶ Schermo Intero";
      btn.style.background = "#1f324d";
      btn.style.borderColor = "#3d8bfd";
      btn.style.color = "#7cb3ff";
    }
  }

  /* =========================================================
     PARSER ED ESECUZIONE FORMATO .LRC
     ========================================================= */

  function parseLRC(lrcText) {
    const lines = lrcText.split('\n');
    const result = [];
    const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

    lines.forEach((line, index) => {
      const match = timeRegex.exec(line);
      if (match) {
        const min = parseInt(match[1], 10);
        const sec = parseInt(match[2], 10);
        const ms = parseInt(match[3].padEnd(3, '0'), 10);
        const totalTime = min * 60 + sec + ms / 1000;
        const text = line.replace(timeRegex, '').trim();

        result.push({ time: totalTime, text: text || '...', id: index });
      } else if (line.trim() !== '') {
        result.push({ time: null, text: line.trim(), id: index });
      }
    });

    return result.sort((a, b) => (a.time === null ? 1 : b.time === null ? -1 : a.time - b.time));
  }

  function renderLrcDisplay() {
    const display = document.getElementById("lrcDisplay");
    display.innerHTML = "";

    if (parsedLrc.length === 0) {
      display.innerHTML = '<div style="color:var(--dim);">Nessun testo presente.</div>';
      return;
    }

    parsedLrc.forEach((item, idx) => {
      const div = document.createElement("div");
      div.className = "lrc-line";
      div.id = `lrc-line-${idx}`;
      div.textContent = item.text;
      display.appendChild(div);
    });
  }

  function togglePlay() {
    if (isPlaying) {
      pausePlay();
    } else {
      startPlay();
    }
  }

  function startPlay() {
    if (parsedLrc.length === 0) return;
    isPlaying = true;
    document.getElementById("btnPlay").textContent = "❚❚ PAUSA";
    document.getElementById("btnPlay").style.background = "#8c6b21";

    const now = Date.now();
    startTime = now - (window.currentLrcTime || 0) * 1000;

    timerInterval = setInterval(() => {
      const currentTime = (Date.now() - startTime) / 1000;
      window.currentLrcTime = currentTime;
      updateLrcHighlight(currentTime);
    }, 100);
  }

  function pausePlay() {
    isPlaying = false;
    clearInterval(timerInterval);
    document.getElementById("btnPlay").textContent = "▶ RIPRENDI SCORRIMENTO";
    document.getElementById("btnPlay").style.background = "#214e30";
  }

  function stopPlay() {
    isPlaying = false;
    clearInterval(timerInterval);
    window.currentLrcTime = 0;
    document.getElementById("btnPlay").textContent = "▶ PLAY SCORRIMENTO";
    document.getElementById("btnPlay").style.background = "#214e30";
    
    document.querySelectorAll('.lrc-line').forEach(el => el.classList.remove('active'));
    const display = document.getElementById("lrcDisplay");
    display.scrollTop = 0;
  }

  function updateLrcHighlight(currentTime) {
    let activeIndex = -1;

    for (let i = 0; i < parsedLrc.length; i++) {
      if (parsedLrc[i].time !== null && parsedLrc[i].time <= currentTime) {
        activeIndex = i;
      } else if (parsedLrc[i].time !== null && parsedLrc[i].time > currentTime) {
        break;
      }
    }

    if (activeIndex !== -1) {
      document.querySelectorAll('.lrc-line').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`lrc-line-${activeIndex}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }

  function toggleEditMode() {
    isRawEditMode = !isRawEditMode;
    const lrcDisplay = document.getElementById("lrcDisplay");
    const rawEditor = document.getElementById("songNotes");
    const btn = document.getElementById("btnEditMode");

    if (isRawEditMode) {
      lrcDisplay.style.display = "none";
      rawEditor.style.display = "block";
      btn.textContent = "👁️ Vedi Testo Pulito";
    } else {
      rawEditor.style.display = "none";
      lrcDisplay.style.display = "block";
      btn.textContent = "✏️ Modifica Codice LRC/Testo";
      
      parsedLrc = parseLRC(rawEditor.value);
      renderLrcDisplay();
    }
  }

  /* =========================================================
     ESECUZIONE BRANO LIVE & CONTROLLI NOTE
     ========================================================= */

  function onSongChange(songIndex) {
    const lyricsBtn = document.getElementById("lyricsLink");
    const notesContainer = document.getElementById("notesContainer");
    const notesArea = document.getElementById("songNotes");
    const playerBar = document.getElementById("playerBar");
    const saveNotesBtn = document.getElementById("btnSaveLiveNotes");

    stopPlay();

    if (songIndex === "") {
      activeSongIndex = null;
      lyricsBtn.style.display = "none";
      notesContainer.style.display = "none";
      if (isFullscreen) toggleFullscreen();
      return;
    }

    activeSongIndex = parseInt(songIndex, 10);
    const selectedSong = songs[activeSongIndex];

    if (selectedSong) {
      sendPresetChange(selectedSong.preset);
      log(`BRANO CARICATO: ${selectedSong.title}`);

      const query = encodeURIComponent(`${selectedSong.title} lyrics testo`);
      lyricsBtn.href = `https://www.google.com/search?q=${query}`;
      lyricsBtn.textContent = `🔍 Cerca testo di "${selectedSong.title}"`;
      lyricsBtn.style.display = "block";

      const rawContent = selectedSong.notes || "";
      notesArea.value = rawContent;
      parsedLrc = parseLRC(rawContent);

      const hasTiming = parsedLrc.some(item => item.time !== null);
      playerBar.style.display = hasTiming ? "flex" : "none";

      isRawEditMode = false;
      document.getElementById("lrcDisplay").style.display = "block";
      notesArea.style.display = "none";
      document.getElementById("btnEditMode").textContent = "✏️ Modifica Codice LRC/Testo";

      renderLrcDisplay();
      saveNotesBtn.style.display = "none";
      notesContainer.style.display = "block";
    }
  }

  function changeFontSize(size) {
    document.getElementById("lrcDisplay").style.fontSize = size;
    document.getElementById("songNotes").style.fontSize = size;
  }

  function scrollNotes(direction) {
    const container = isRawEditMode ? document.getElementById("songNotes") : document.getElementById("lrcDisplay");
    const scrollAmount = 180;
    if (direction === 'up') {
      container.scrollTop -= scrollAmount;
    } else {
      container.scrollTop += scrollAmount;
    }
  }

  function onNotesInput() {
    document.getElementById("btnSaveLiveNotes").style.display = "block";
  }

  function saveLiveNotes() {
    if (activeSongIndex === null) return;
    
    const newNotes = document.getElementById("songNotes").value;
    songs[activeSongIndex].notes = newNotes;
    saveSongsToStorage();

    parsedLrc = parseLRC(newNotes);
    const hasTiming = parsedLrc.some(item => item.time !== null);
    document.getElementById("playerBar").style.display = hasTiming ? "flex" : "none";

    document.getElementById("btnSaveLiveNotes").style.display = "none";
    log(`Note e timing aggiornati per: ${songs[activeSongIndex].title}`);
  }

  function prevSong() {
    const select = document.getElementById("songSelect");
    let currentIndex = parseInt(select.value, 10);
    if (isNaN(currentIndex) || currentIndex <= 0) {
      currentIndex = songs.length - 1;
    } else {
      currentIndex--;
    }
    select.value = currentIndex;
    onSongChange(currentIndex);
  }

  function nextSong() {
    const select = document.getElementById("songSelect");
    let currentIndex = parseInt(select.value, 10);
    if (isNaN(currentIndex) || currentIndex >= songs.length - 1) {
      currentIndex = 0;
    } else {
      currentIndex++;
    }
    select.value = currentIndex;
    onSongChange(currentIndex);
  }
</script>

</body>
</html>
