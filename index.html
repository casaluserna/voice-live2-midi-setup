<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoiceLive 2 FX Controller</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #1c1f26;
      --border: #2e3440;
      --text: #eceff4;
      --text-dim: #8892b0;
      --active-glow: rgba(0, 230, 118, 0.4);
    }

    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Barra di connessione e canali */
    .connection-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    label { font-size: 0.8rem; color: var(--text-dim); }

    select {
      background: #0d0f12;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
      flex-grow: 1;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      background: #c62828;
      color: #fff;
    }
    .badge.connected { background: #2e7d32; }

    /* Griglia Effetti */
    .fx-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-top: 10px;
    }

    .fx-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s ease, transform 0.05s ease;
    }

    .fx-card:active { transform: scale(0.97); }

    .fx-card .fx-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .fx-card .fx-desc {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .fx-card .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444;
      margin-top: 10px;
    }

    /* Stili dinamici di attivazione con codice colore stile pedaliera */
    .fx-card.active { border-color: #fff; }

    .fx-card.active .indicator {
      box-shadow: 0 0 10px currentColor;
    }

    /* Colori specifici per effetto */
    .color-harmony.active { border-color: #ffd166; color: #ffd166; }
    .color-harmony.active .indicator { background: #ffd166; }

    .color-double.active { border-color: #06d6a0; color: #06d6a0; }
    .color-double.active .indicator { background: #06d6a0; }

    .color-reverb.active { border-color: #118ab2; color: #118ab2; }
    .color-reverb.active .indicator { background: #118ab2; }

    .color-delay.active { border-color: #00b4d8; color: #00b4d8; }
    .color-delay.active .indicator { background: #00b4d8; }

    .color-mod.active { border-color: #b388ff; color: #b388ff; }
    .color-mod.active .indicator { background: #b388ff; }

    .color-trans.active { border-color: #ef476f; color: #ef476f; }
    .color-trans.active .indicator { background: #ef476f; }

    .color-tune.active { border-color: #ff9f1c; color: #ff9f1c; }
    .color-tune.active .indicator { background: #ff9f1c; }

    .color-rhythm.active { border-color: #e040fb; color: #e040fb; }
    .color-rhythm.active .indicator { background: #e040fb; }

    /* Barra Master Utility */
    .utility-bar {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-top: 16px;
    }

    .btn-util {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-bypass {
      border-color: #b71c1c;
      color: #ff8a80;
    }
  </style>
</head>
<body>

  <header>
    <h1>VoiceLive 2 FX Pad</h1>
    <div class="connection-panel">
      <div class="row">
        <label for="midi-out">Dispositivo:</label>
        <select id="midi-out"><option>In attesa di dispositivi...</option></select>
        <span id="conn-badge" class="badge">OFFLINE</span>
      </div>
      <div class="row">
        <label for="midi-chan">Canale MIDI (Setup VL2):</label>
        <select id="midi-chan">
          <option value="0" selected>Canale 1</option>
          <option value="1">Canale 2</option>
          <option value="2">Canale 3</option>
          <option value="3">Canale 4</option>
          <option value="15">Canale 16</option>
        </select>
      </div>
    </div>
  </header>

  <main class="fx-grid">
    <div class="fx-card color-harmony" onclick="toggleFx(110, this)">
      <span class="fx-name">Harmony</span>
      <span class="fx-desc">CC 110 • Armonie</span>
      <div class="indicator"></div>
    </div>

    <div class="fx-card color-double" onclick="toggleFx(111, this)">
      <span class="fx-name">Double</span>
      <span class="fx-desc">CC 111 • Raddoppio</span>
      <div class="indicator"></div>
    </div>

    <div class="fx-card color-reverb" onclick="toggleFx(112, this)">
      <span class="fx-name">Reverb</span>
      <span class="fx-desc">CC 112 • Riverbero</span>
      <div class="indicator"></div>
    </div>

    <div class="fx-card color-delay" onclick="toggleFx(117, this)">
      <span class="fx-name">Delay</span>
      <span class="fx-desc">CC 117 • Eco / Delay</span>
      <div class="indicator"></div>
    </div>

    <div class="fx-card color-mod" onclick="toggleFx(116, this)">
      <span class="fx-name">µMod</span>
      <span class="fx-desc">CC 116 • Chorus / Flange</span>
      <div class="indicator"></div>
    </div>

    <div class="fx-card color-trans" onclick="toggleFx(115, this)">
      <span class="fx-name">Transducer</span>
      <span class="fx-desc">CC 115 • Dist / Megafono</span>
      <div class="indicator"></div>
    </div>

    <div class="fx-card color-tune" onclick="toggleFx(113, this)">
      <span class="fx-name">HardTune</span>
      <span class="fx-desc">CC 113 • Pitch Correzione</span>
      <div class="indicator"></div>
    </div>

    <div class="fx-card color-rhythm" onclick="toggleFx(114, this)">
      <span class="fx-name">Rhythmic</span>
      <span class="fx-desc">CC 114 • Stutter / Tremolo</span>
      <div class="indicator"></div>
    </div>
  </main>

  <section class="utility-bar">
    <button class="btn-util btn-bypass" onclick="allFxOff()">TUTTI GLI FX OFF</button>
    <button class="btn-util" onclick="allFxOn()">TUTTI GLI FX ON</button>
  </section>

  <script>
    let midiAccess = null;
    let selectedOutput = null;
    const fxState = {
      110: false, // Harmony
      111: false, // Double
      112: false, // Reverb
      113: false, // HardTune
      114: false, // Rhythmic
      115: false, // Transducer
      116: false, // uMod
      117: false  // Delay
    };

    const outSelect = document.getElementById('midi-out');
    const chanSelect = document.getElementById('midi-chan');
    const connBadge = document.getElementById('conn-badge');

    // Richiesta permessi Web MIDI
    if (navigator.requestMIDIAccess) {
      navigator.requestMIDIAccess({ sysex: false })
        .then(initMIDI, () => alert("Errore: impossibile accedere all'hardware MIDI."));
    } else {
      alert("Il browser corrente non supporta le Web MIDI API (usa Chrome su Android o Web MIDI Browser su iOS).");
    }

    function initMIDI(access) {
      midiAccess = access;
      midiAccess.onstatechange = scanPorts;
      scanPorts();
    }

    function scanPorts() {
      outSelect.innerHTML = '';
      const outputs = Array.from(midiAccess.outputs.values());

      if (outputs.length === 0) {
        outSelect.innerHTML = '<option value="">Nessuna periferica collegata</option>';
        connBadge.innerText = 'OFFLINE';
        connBadge.classList.remove('connected');
        selectedOutput = null;
        return;
      }

      outputs.forEach(output => {
        const opt = document.createElement('option');
        opt.value = output.id;
        opt.text = output.name || `Porta MIDI (${output.id})`;
        outSelect.appendChild(opt);
      });

      selectedOutput = outputs[0];
      connBadge.innerText = 'ONLINE';
      connBadge.classList.add('connected');
    }

    outSelect.addEventListener('change', () => {
      selectedOutput = midiAccess.outputs.get(outSelect.value);
    });

    // Invio comando CC (Control Change)
    function sendCC(ccNumber, value) {
      if (!selectedOutput) {
        alert("Nessun dispositivo MIDI connesso.");
        return;
      }
      const channel = parseInt(chanSelect.value, 10);
      const statusByte = 0xB0 + channel; // 0xB0 = CC sul canale specificato
      selectedOutput.send([statusByte, ccNumber, value]);
    }

    // Toggle singolo effetto
    function toggleFx(ccNumber, element) {
      fxState[ccNumber] = !fxState[ccNumber];
      const val = fxState[ccNumber] ? 127 : 0;
      
      sendCC(ccNumber, val);
      element.classList.toggle('active', fxState[ccNumber]);
    }

    // Spegnimento simultaneo di tutti gli effetti
    function allFxOff() {
      const cards = document.querySelectorAll('.fx-card');
      Object.keys(fxState).forEach((cc, index) => {
        fxState[cc] = false;
        sendCC(parseInt(cc, 10), 0);
        cards[index].classList.remove('active');
      });
    }

    // Accensione simultanea di tutti gli effetti
    function allFxOn() {
      const cards = document.querySelectorAll('.fx-card');
      Object.keys(fxState).forEach((cc, index) => {
        fxState[cc] = true;
        sendCC(parseInt(cc, 10), 127);
        cards[index].classList.add('active');
      });
    }
  </script>
</body>
</html>
