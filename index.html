<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>VoiceLive 2 MIDI Controller</title>

<style>
:root{
  --bg:#101216;
  --card:#191c22;
  --card2:#20242c;
  --text:#ffffff;
  --dim:#9da3ad;
  --green:#25d366;
  --red:#ff4d4d;
  --blue:#3d8bfd;
  --yellow:#ffc107;
  --border:#30353f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.container{
  max-width:650px;
  margin:auto;
  padding:18px;
}

h1{
  text-align:center;
  margin:5px 0 20px;
  font-size:24px;
}

.status{
  text-align:center;
  padding:10px;
  border-radius:10px;
  background:#191c22;
  margin-bottom:15px;
  font-weight:bold;
}

.status.ok{
  color:var(--green);
}

.status.error{
  color:var(--red);
}

.section{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:6px;
  color:var(--dim);
  font-size:13px;
}

select,
button{
  width:100%;
  min-height:48px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card2);
  color:white;
  font-size:16px;
}

select{
  padding:0 10px;
}

button{
  cursor:pointer;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.connect{
  margin-top:10px;
  background:#26364f;
}

.connect.in{
  background:#28452f;
}

.connect:disabled{
  opacity:.5;
}

.fx-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.fx{
  position:relative;
  min-height:100px;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--card);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.fx-name{
  font-weight:bold;
  font-size:17px;
}

.cc{
  font-size:12px;
  color:var(--dim);
}

.fx button{
  min-height:42px;
  margin-top:8px;
}

.fx.active{
  border-color:var(--green);
  box-shadow:0 0 12px rgba(37,211,102,.18);
}

.fx.active button{
  background:var(--green);
  color:#000;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.all-off{
  background:#512222;
}

.all-on{
  background:#214e30;
}

.test{
  background:#273b5c;
}

.log{
  height:180px;
  overflow:auto;
  background:#090b0e;
  border-radius:10px;
  padding:10px;
  font-family:monospace;
  font-size:12px;
  color:#bfc5cf;
  white-space:pre-wrap;
}

.small{
  font-size:12px;
  color:var(--dim);
  margin-top:8px;
  line-height:1.4;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:6px;
  font-size:11px;
  margin-left:5px;
  background:#333;
}

.badge.green{
  background:#1e6035;
  color:#8cffae;
}

.badge.yellow{
  background:#5e4c12;
  color:#ffe98a;
}
</style>
</head>

<body>

<div class="container">

<h1>VoiceLive 2 MIDI Controller</h1>

<div id="mainStatus" class="status">
  MIDI OFFLINE
</div>

<!-- MIDI OUTPUT -->

<div class="section">

<label>MIDI OUT — SK-7 collegato al MIDI IN del VoiceLive 2</label>

<button id="connectOut"
        class="connect"
        onclick="connectOutputSK7()">
  CONNETTI SK-7 OUT
</button>

<div id="outInfo" class="small">
  Non collegato
</div>

</div>

<!-- MIDI INPUT -->

<div class="section">

<label>MIDI INPUT — SK-7 collegato al MIDI OUT del VoiceLive 2</label>

<button id="connectIn"
        class="connect in"
        onclick="connectInputSK7()">
  CONNETTI SK-7 IN
</button>

<div id="inInfo" class="small">
  Feedback MIDI non collegato
</div>

</div>

<!-- CHANNEL -->

<div class="section">

<label>Canale MIDI</label>

<select id="midiChannel">
<option value="0">Canale 1</option>
<option value="1">Canale 2</option>
<option value="2">Canale 3</option>
<option value="3">Canale 4</option>
<option value="4">Canale 5</option>
<option value="5">Canale 6</option>
<option value="6">Canale 7</option>
<option value="7">Canale 8</option>
<option value="8">Canale 9</option>
<option value="9">Canale 10</option>
<option value="10">Canale 11</option>
<option value="11">Canale 12</option>
<option value="12">Canale 13</option>
<option value="13">Canale 14</option>
<option value="14">Canale 15</option>
<option value="15">Canale 16</option>
</select>

</div>

<!-- FX -->

<div class="section">

<h2>VoiceLive 2</h2>

<div class="fx-grid">

<!-- HARMONY -->

<div class="fx" id="fx-110">

<div>
<div class="fx-name">Harmony</div>
<div class="cc">CC 110</div>
</div>

<button onclick="toggleFx(110,this)">
OFF
</button>

</div>

<!-- DOUBLE -->

<div class="fx" id="fx-111">

<div>
<div class="fx-name">Double</div>
<div class="cc">CC 111</div>
</div>

<button onclick="toggleFx(111,this)">
OFF
</button>

</div>

<!-- REVERB -->

<div class="fx" id="fx-112">

<div>
<div class="fx-name">Reverb</div>
<div class="cc">CC 112</div>
</div>

<button onclick="toggleFx(112,this)">
OFF
</button>

</div>

<!-- HARDTUNE -->

<div class="fx" id="fx-113">

<div>
<div class="fx-name">HardTune</div>
<div class="cc">CC 113</div>
</div>

<button onclick="toggleFx(113,this)">
OFF
</button>

</div>

<!-- UMOD -->

<div class="fx" id="fx-116">

<div>
<div class="fx-name">µMod</div>
<div class="cc">CC 116</div>
</div>

<button onclick="toggleFx(116,this)">
OFF
</button>

</div>

<!-- DELAY -->

<div class="fx" id="fx-117">

<div>
<div class="fx-name">Delay</div>
<div class="cc">CC 117</div>
</div>

<button onclick="toggleFx(117,this)">
OFF
</button>

</div>

<!-- TRANSDUCER -->

<div class="fx" id="fx-118">

<div>
<div class="fx-name">Transducer</div>
<div class="cc">CC 118</div>
</div>

<button onclick="toggleFx(118,this)">
OFF
</button>

</div>

<!-- BYPASS -->

<div class="fx" id="fx-114">

<div>
<div class="fx-name">Bypass</div>
<div class="cc">CC 114</div>
</div>

<button onclick="toggleFx(114,this)">
OFF
</button>

</div>

</div>

</div>

<!-- ACTIONS -->

<div class="section">

<div class="actions">

<button class="all-off"
        onclick="allFxOff()">
TUTTO OFF
</button>

<button class="all-on"
        onclick="allFxOn()">
TUTTO ON
</button>

</div>

</div>

<!-- TEST -->

<div class="section">

<button class="test"
        onclick="testHarmony()">
TEST HARMONY
</button>

<div class="small">
Invia Harmony ON per 1 secondo e poi OFF.
</div>

</div>

<!-- LOG -->

<div class="section">

<label>LOG MIDI</label>

<div id="log" class="log"></div>

</div>

</div>

<script>

/* =========================================================
   BLE MIDI
   ========================================================= */

const BLE_MIDI_SERVICE =
  "03b80e5a-ede8-4b33-a751-6ce34ec4c700";

const BLE_MIDI_CHARACTERISTIC =
  "7772e5db-3868-4112-a1a9-f2669d106bf3";


/* =========================================================
   SK-7 OUTPUT
   Android -> SK7 OUT -> VoiceLive MIDI IN
   ========================================================= */

let outDevice = null;
let outServer = null;
let outCharacteristic = null;


/* =========================================================
   SK-7 INPUT
   VoiceLive MIDI OUT -> SK7 IN -> Android
   ========================================================= */

let inDevice = null;
let inServer = null;
let inCharacteristic = null;


/* =========================================================
   FX STATE
   ========================================================= */

const fxState = {

  110:false,
  111:false,
  112:false,
  113:false,
  114:false,
  116:false,
  117:false,
  118:false

};


/* =========================================================
   LOG
   ========================================================= */

function log(message){

  const box = document.getElementById("log");

  const time =
    new Date().toLocaleTimeString();

  box.textContent +=
    "[" + time + "] " + message + "\n";

  box.scrollTop = box.scrollHeight;
}


/* =========================================================
   STATUS
   ========================================================= */

function updateStatus(){

  const status =
    document.getElementById("mainStatus");

  if(outCharacteristic){

    status.textContent =
      "MIDI ONLINE";

    status.className =
      "status ok";

  }else{

    status.textContent =
      "MIDI OFFLINE";

    status.className =
      "status";

  }

}


/* =========================================================
   CONNECT SK-7 OUT
   ========================================================= */

async function connectOutputSK7(){

  try{

    log("Ricerca SK-7 OUT...");

    outDevice =
      await navigator.bluetooth.requestDevice({

        filters:[
          {
            services:[
              BLE_MIDI_SERVICE
            ]
          }
        ],

        optionalServices:[
          BLE_MIDI_SERVICE
        ]

      });

    log(
      "SK-7 OUT trovato: " +
      (outDevice.name || "dispositivo")
    );

    outServer =
      await outDevice.gatt.connect();

    const service =
      await outServer.getPrimaryService(
        BLE_MIDI_SERVICE
      );

    outCharacteristic =
      await service.getCharacteristic(
        BLE_MIDI_CHARACTERISTIC
      );

    document.getElementById("outInfo").innerHTML =
      "Connesso: <b>" +
      (outDevice.name || "SK-7") +
      "</b> <span class='badge green'>OUT</span>";

    document.getElementById("connectOut").textContent =
      "SK-7 OUT CONNESSO";

    log("SK-7 OUT connesso.");

    updateStatus();

    outDevice.addEventListener(
      "gattserverdisconnected",
      ()=>{
        outCharacteristic = null;

        document.getElementById("outInfo").textContent =
          "SK-7 OUT disconnesso";

        log("SK-7 OUT disconnesso.");

        updateStatus();
      }
    );

  }catch(error){

    console.error(error);

    log(
      "ERRORE SK-7 OUT: " +
      error.message
    );

  }

}


/* =========================================================
   CONNECT SK-7 IN
   ========================================================= */

async function connectInputSK7(){

  try{

    log("Ricerca SK-7 IN...");

    inDevice =
      await navigator.bluetooth.requestDevice({

        filters:[
          {
            services:[
              BLE_MIDI_SERVICE
            ]
          }
        ],

        optionalServices:[
          BLE_MIDI_SERVICE
        ]

      });

    log(
      "SK-7 IN trovato: " +
      (inDevice.name || "dispositivo")
    );

    inServer =
      await inDevice.gatt.connect();

    const service =
      await inServer.getPrimaryService(
        BLE_MIDI_SERVICE
      );

    inCharacteristic =
      await service.getCharacteristic(
        BLE_MIDI_CHARACTERISTIC
      );


    /* -----------------------------------------
       ABILITA NOTIFICHE MIDI
       ----------------------------------------- */

    await inCharacteristic.startNotifications();

    inCharacteristic.addEventListener(
      "characteristicvaluechanged",
      onBLEMidiMessage
    );


    document.getElementById("inInfo").innerHTML =
      "Connesso: <b>" +
      (inDevice.name || "SK-7") +
      "</b> <span class='badge green'>IN</span>";

    document.getElementById("connectIn").textContent =
      "SK-7 IN CONNESSO";

    log("SK-7 IN connesso.");
    log("In ascolto del MIDI OUT del VoiceLive 2.");

    inDevice.addEventListener(
      "gattserverdisconnected",
      ()=>{

        inCharacteristic = null;

        document.getElementById("inInfo").textContent =
          "SK-7 IN disconnesso";

        log("SK-7 IN disconnesso.");

      }
    );

  }catch(error){

    console.error(error);

    log(
      "ERRORE SK-7 IN: " +
      error.message
    );

  }

}


/* =========================================================
   INVIO MIDI CC
   ========================================================= */

async function sendCC(
  cc,
  value
){

  const channel =
    parseInt(
      document.getElementById("midiChannel").value
    );

  const status =
    0xB0 + channel;

  value =
    Math.max(
      0,
      Math.min(
        127,
        value
      )
    );


  /* -----------------------------------------
     BLE MIDI packet
     ----------------------------------------- */

  const timestamp =
    0x80;

  const packet =
    new Uint8Array([

      timestamp,
      timestamp,

      status,
      cc,
      value

    ]);


  /* -----------------------------------------
     SK-7 OUT
     ----------------------------------------- */

  if(outCharacteristic){

    try{

      if(
        outCharacteristic.writeValueWithoutResponse
      ){

        await outCharacteristic
          .writeValueWithoutResponse(packet);

      }else{

        await outCharacteristic
          .writeValue(packet);

      }

      log(
        "OUT  CH" +
        (channel + 1) +
        " CC" +
        cc +
        " = " +
        value
      );

      return true;

    }catch(error){

      log(
        "Errore invio CC" +
        cc +
        ": " +
        error.message
      );

      return false;

    }

  }


  /* -----------------------------------------
     WEB MIDI FALLBACK
     ----------------------------------------- */

  if(
    typeof navigator.requestMIDIAccess ===
    "function"
  ){

    try{

      const midi =
        await navigator.requestMIDIAccess();

      let sent = false;

      midi.outputs.forEach(
        output => {

          output.send([
            status,
            cc,
            value
          ]);

          sent = true;

        }
      );

      if(sent){

        log(
          "WEB MIDI  CC" +
          cc +
          " = " +
          value
        );

        return true;

      }

    }catch(error){

      log(
        "Web MIDI error: " +
        error.message
      );

    }

  }


  log(
    "Nessuna uscita MIDI disponibile."
  );

  return false;

}


/* =========================================================
   TOGGLE FX
   ========================================================= */

async function toggleFx(
  cc,
  button
){

  const newState =
    !fxState[cc];

  const value =
    newState ? 127 : 0;

  const sent =
    await sendCC(
      cc,
      value
    );

  if(!sent){

    return;

  }

  fxState[cc] =
    newState;

  updateFxUI(
    cc,
    newState
  );

}


/* =========================================================
   AGGIORNA UI FX
   ========================================================= */

function updateFxUI(
  cc,
  state
){

  const card =
    document.getElementById(
      "fx-" + cc
    );

  if(!card){

    return;

  }

  const button =
    card.querySelector("button");

  if(state){

    card.classList.add("active");

    button.textContent =
      "ON";

  }else{

    card.classList.remove("active");

    button.textContent =
      "OFF";

  }

}


/* =========================================================
   TUTTO OFF
   ========================================================= */

async function allFxOff(){

  const ccs =
    Object.keys(fxState);

  for(
    const cc of ccs
  ){

    await sendCC(
      parseInt(cc),
      0
    );

    fxState[cc] =
      false;

    updateFxUI(
      parseInt(cc),
      false
    );

  }

  log(
    "TUTTI GLI FX OFF"
  );

}


/* =========================================================
   TUTTO ON
   ========================================================= */

async function allFxOn(){

  const ccs =
    Object.keys(fxState);

  for(
    const cc of ccs
  ){

    await sendCC(
      parseInt(cc),
      127
    );

    fxState[cc] =
      true;

    updateFxUI(
      parseInt(cc),
      true
    );

  }

  log(
    "TUTTI GLI FX ON"
  );

}


/* =========================================================
   TEST HARMONY
   ========================================================= */

async function testHarmony(){

  log(
    "TEST HARMONY ON"
  );

  await sendCC(
    110,
    127
  );

  fxState[110] =
    true;

  updateFxUI(
    110,
    true
  );

  setTimeout(
    async ()=>{

      log(
        "TEST HARMONY OFF"
      );

      await sendCC(
        110,
        0
      );

      fxState[110] =
        false;

      updateFxUI(
        110,
        false
      );

    },
    1000
  );

}


/* =========================================================
   MIDI BLE RECEVUTO
   ========================================================= */

function onBLEMidiMessage(
  event
){

  const data =
    new Uint8Array(
      event.target.value.buffer
    );

  if(
    data.length < 3
  ){

    return;

  }

  log(
    "IN  RAW: " +
    Array.from(data)
      .map(
        x =>
          x.toString(16)
           .padStart(2,"0")
      )
      .join(" ")
  );


  /*
   * Cerchiamo un MIDI Control Change
   *
   * Status:
   * B0-BF
   *
   * seguito da:
   * CC number
   * value
   */

  for(
    let i = 2;
    i < data.length - 2;
    i++
  ){

    const byte =
      data[i];


    /*
     * Control Change
     */

    if(
      (byte & 0xF0) === 0xB0
    ){

      const channel =
        byte & 0x0F;

      const cc =
        data[i + 1];

      const value =
        data[i + 2];


      /*
       * Controlliamo che siano
       * veri byte MIDI dati
       */

      if(
        cc < 128 &&
        value < 128
      ){

        processIncomingCC(
          channel,
          cc,
          value
        );

      }

    }

  }

}


/* =========================================================
   PROCESSA CC RICEVUTO
   ========================================================= */

function processIncomingCC(
  channel,
  cc,
  value
){

  log(
    "IN  CH" +
    (channel + 1) +
    " CC" +
    cc +
    " = " +
    value
  );


  /*
   * FX ON/OFF
   *
   * 0-63  = OFF
   * 64-127 = ON
   */

  if(
    Object.prototype.hasOwnProperty
      .call(
        fxState,
        cc
      )
  ){

    const state =
      value >= 64;

    fxState[cc] =
      state;

    updateFxUI(
      cc,
      state
    );

    log(
      "VOICE LIVE -> " +
      getFxName(cc) +
      " = " +
      (state ? "ON" : "OFF")
    );

  }

}


/* =========================================================
   NOMI FX
   ========================================================= */

function getFxName(
  cc
){

  const names = {

    110:"Harmony",
    111:"Double",
    112:"Reverb",
    113:"HardTune",
    114:"Bypass",
    116:"µMod",
    117:"Delay",
    118:"Transducer"

  };

  return names[cc] ||
         ("CC " + cc);

}


/* =========================================================
   STEP
   =========================================================

   CC115 NON è un ON/OFF.

   Il VoiceLive 2 usa:
   0 = Step 1
   1 = Step 2
   ecc.

   Per questo non lo inseriamo nei pulsanti ON/OFF.
   ========================================================= */

function sendStep(
  step
){

  sendCC(
    115,
    step
  );

}


/* =========================================================
   INIT
   ========================================================= */

window.addEventListener(
  "load",
  ()=>{

    log(
      "Pagina caricata."
    );

    if(
      !navigator.bluetooth
    ){

      log(
        "ATTENZIONE: Web Bluetooth non disponibile."
      );

    }else{

      log(
        "Web Bluetooth disponibile."
      );

    }

  }
);

</script>

</body>
</html>
