<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>VoiceLive 2 FX Controller</title>

<style>

:root{
  --bg:#0f1115;
  --card:#1c1f26;
  --border:#303642;
  --text:#eceff4;
  --dim:#8892b0;
  --blue:#1557b0;
  --green:#2e7d32;
  --red:#c62828;
}

*{
  box-sizing:border-box;
  touch-action:manipulation;
}

body{
  margin:0;
  padding:16px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

header,
.fx-grid,
.utility-bar,
.midi-panel{
  width:100%;
  max-width:640px;
}

header{
  margin-bottom:16px;
}

.connection-panel,
.midi-panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}

.connection-panel{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

label{
  font-size:.8rem;
  color:var(--dim);
  white-space:nowrap;
}

select{
  background:#0d0f12;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px 10px;
  font-size:.9rem;
  outline:none;
  flex:1;
}

.badge{
  font-size:.75rem;
  padding:5px 9px;
  border-radius:7px;
  font-weight:700;
  background:var(--red);
  color:#fff;
  white-space:nowrap;
}

.badge.connected{
  background:var(--green);
}

.btn-connect{
  width:100%;
  padding:15px;
  border:1px solid #1976d2;
  border-radius:9px;
  background:#1557b0;
  color:white;
  font-weight:800;
  font-size:.95rem;
  cursor:pointer;
}

.btn-connect:active{
  transform:scale(.98);
}

.btn-connect.connected{
  background:#246b28;
  border-color:#3fa345;
}

.fx-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.fx-card{
  background:var(--card);
  border:2px solid var(--border);
  border-radius:13px;
  padding:22px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  min-height:130px;
  transition:.12s;
}

.fx-card:active{
  transform:scale(.97);
}

.fx-name{
  font-size:1.1rem;
  font-weight:700;
  margin-bottom:5px;
}

.fx-desc{
  font-size:.7rem;
  color:var(--dim);
  text-transform:uppercase;
  text-align:center;
  letter-spacing:.4px;
}

.indicator{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#444;
  margin-top:11px;
}

.fx-card.active{
  border-color:#fff;
}

.color-harmony.active{
  border-color:#ffd166;
  color:#ffd166;
}

.color-harmony.active .indicator{
  background:#ffd166;
}

.color-double.active{
  border-color:#06d6a0;
  color:#06d6a0;
}

.color-double.active .indicator{
  background:#06d6a0;
}

.color-reverb.active{
  border-color:#118ab2;
  color:#118ab2;
}

.color-reverb.active .indicator{
  background:#118ab2;
}

.color-delay.active{
  border-color:#00b4d8;
  color:#00b4d8;
}

.color-delay.active .indicator{
  background:#00b4d8;
}

.color-mod.active{
  border-color:#b388ff;
  color:#b388ff;
}

.color-mod.active .indicator{
  background:#b388ff;
}

.color-trans.active{
  border-color:#ef476f;
  color:#ef476f;
}

.color-trans.active .indicator{
  background:#ef476f;
}

.color-tune.active{
  border-color:#ff9f1c;
  color:#ff9f1c;
}

.color-tune.active .indicator{
  background:#ff9f1c;
}

.color-rhythm.active{
  border-color:#e040fb;
  color:#e040fb;
}

.color-rhythm.active .indicator{
  background:#e040fb;
}

.utility-bar{
  display:flex;
  gap:12px;
  margin-top:16px;
}

.btn-util{
  flex:1;
  padding:15px 8px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-weight:800;
  font-size:.82rem;
}

.btn-bypass{
  border-color:#b71c1c;
  color:#ff8a80;
}

.midi-panel{
  margin-top:14px;
}

.midi-buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.btn-midi{
  flex:1;
  padding:11px 5px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-weight:700;
  font-size:.75rem;
}

.monitor{
  height:150px;
  overflow-y:auto;
  background:#080a0d;
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px;
  margin-top:8px;
  font:12px monospace;
  color:#9be7ff;
  white-space:pre-wrap;
}

.small{
  font-size:.7rem;
  color:var(--dim);
  margin-top:8
